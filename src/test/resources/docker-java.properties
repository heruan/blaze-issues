# Docker 29 (Docker Desktop 4.52+) requires Docker API >= 1.44 and rejects the
# older version negotiated by the docker-java client bundled with Testcontainers
# 1.21.x with HTTP 400 ("client version is too old"), surfacing as
# "Could not find a valid Docker environment". Pinning the API version here
# restores compatibility without upgrading Testcontainers.
# See https://github.com/testcontainers/testcontainers-java/issues/11235
api.version=1.44
